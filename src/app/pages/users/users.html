<div class="min-h-screen bg-gray-100 p-8">

  <!-- Título -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">

    <div>
      <h1 class="text-4xl font-bold text-gray-800">
        Usuarios Registrados
      </h1>

      <p class="text-gray-500 mt-2">
        Administra todos los usuarios de tu plataforma
      </p>
    </div>

    <button
      routerLink="/users/add"
      class="mt-4 md:mt-0 bg-blue-600 hover:bg-blue-700 text-white
             px-6 py-3 rounded-2xl shadow-lg transition font-semibold"
    >
      + Agregar Usuario
    </button>

  </div>

  <!-- Grid de Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- Card Usuario -->
    <div class="bg-white rounded-3xl shadow-lg overflow-hidden hover:scale-105 transition duration-300">

      <!-- Header -->
      <div class="bg-linear-to-r from-blue-500 to-blue-700 p-6 flex flex-col items-center">

        <img
          src="https://i.pravatar.cc/150?img=12"
          alt="Usuario"
          class="w-24 h-24 rounded-full border-4 border-white shadow-md object-cover"
        />

        <h2 class="text-white text-xl font-bold mt-4">
          Sergio Hernández
        </h2>

        <p class="text-blue-100">
          Administrador
        </p>

      </div>

      <!-- Información -->
      <div class="p-6 space-y-4">

        <div class="flex items-center justify-between">
          <span class="text-gray-500 font-medium">
            Correo
          </span>

          <span class="text-gray-800 font-semibold text-sm">
            sergio@gmail.com
          </span>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-gray-500 font-medium">
            Teléfono
          </span>

          <span class="text-gray-800 font-semibold">
            951 123 4567
          </span>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-gray-500 font-medium">
            Estado
          </span>

          <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
            Activo
          </span>
        </div>

      </div>

      <!-- Botones -->
      <div class="border-t p-5 flex gap-3">

        <button
          class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-white
                 py-3 rounded-xl font-semibold transition"
        >
          Editar
        </button>

        <button
          class="flex-1 bg-red-500 hover:bg-red-600 text-white
                 py-3 rounded-xl font-semibold transition"
        >
          Eliminar
        </button>

      </div>

    </div>

    <!-- Card Usuario -->
    <div class="bg-white rounded-3xl shadow-lg overflow-hidden hover:scale-105 transition duration-300">

      <div class="bg-linear-to-r from-purple-500 to-purple-700 p-6 flex flex-col items-center">

        <img
          src="https://i.pravatar.cc/150?img=32"
          alt="Usuario"
          class="w-24 h-24 rounded-full border-4 border-white shadow-md object-cover"
        />

        <h2 class="text-white text-xl font-bold mt-4">
          María López
        </h2>

        <p class="text-purple-100">
          Cliente
        </p>

      </div>

      <div class="p-6 space-y-4">

        <div class="flex items-center justify-between">
          <span class="text-gray-500 font-medium">Correo</span>
          <span class="text-gray-800 font-semibold text-sm">
            maria@gmail.com
          </span>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-gray-500 font-medium">Teléfono</span>
          <span class="text-gray-800 font-semibold">
            951 987 6543
          </span>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-gray-500 font-medium">Estado</span>

          <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm">
            Pendiente
          </span>
        </div>

      </div>

      <div class="border-t p-5 flex gap-3">

        <button
          class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-white
                 py-3 rounded-xl font-semibold transition"
        >
          Editar
        </button>

        <button
          class="flex-1 bg-red-500 hover:bg-red-600 text-white
                 py-3 rounded-xl font-semibold transition"
        >
          Eliminar
        </button>

      </div>

    </div>

  </div>

</div>
