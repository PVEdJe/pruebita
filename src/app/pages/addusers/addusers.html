<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">

    <!-- Lado Izquierdo -->
    <div class="bg-linear-to-br from-blue-600 to-blue-800 text-white p-10 flex flex-col justify-center">

      <h2 class="text-4xl font-bold mb-4">
        Nuevo Usuario
      </h2>

      <p class="text-blue-100 text-lg mb-8">
        Registra nuevos usuarios y administra el acceso a tu plataforma.
      </p>

      <!-- Avatar Preview -->
      <div class="flex flex-col items-center">

        <div class="w-40 h-40 rounded-full bg-white/20 border-4 border-white/30 flex items-center justify-center overflow-hidden shadow-lg">

          <span class="text-6xl">
            👤
          </span>

        </div>

        <p class="mt-4 text-blue-100">
          Vista previa del usuario
        </p>

      </div>

    </div>

    <!-- Formulario -->
    <div class="p-10">

      <h3 class="text-3xl font-bold text-gray-800 mb-8">
        Información del Usuario
      </h3>

      <form class="space-y-6">

        <!-- Foto -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Foto de perfil
          </label>

          <input
            type="file"
            class="w-full border-2 border-dashed border-gray-300 rounded-2xl p-4
                   file:bg-blue-600 file:text-white file:border-0
                   file:px-4 file:py-2 file:rounded-xl
                   hover:border-blue-400 transition"
          />
        </div>

        <!-- Nombre -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Nombre completo
          </label>

          <input
            type="text"
            placeholder="Ej. Sergio Hernández"
            class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                   focus:outline-none focus:ring-2 focus:ring-blue-600"
          />
        </div>

        <!-- Correo -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Correo electrónico
          </label>

          <input
            type="email"
            placeholder="correo@ejemplo.com"
            class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                   focus:outline-none focus:ring-2 focus:ring-blue-600"
          />
        </div>

        <!-- Teléfono -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Teléfono
          </label>

          <input
            type="tel"
            placeholder="951 123 4567"
            class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                   focus:outline-none focus:ring-2 focus:ring-blue-600"
          />
        </div>

        <!-- Rol y Estado -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <!-- Rol -->
          <div>
            <label class="block text-gray-700 font-semibold mb-2">
              Rol
            </label>

            <select
              class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                     focus:outline-none focus:ring-2 focus:ring-blue-600"
            >
              <option>Selecciona un rol</option>
              <option>Administrador</option>
              <option>Cliente</option>
              <option>Editor</option>
            </select>
          </div>

          <!-- Estado -->
          <div>
            <label class="block text-gray-700 font-semibold mb-2">
              Estado
            </label>

            <select
              class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                     focus:outline-none focus:ring-2 focus:ring-blue-600"
            >
              <option>Activo</option>
              <option>Inactivo</option>
              <option>Pendiente</option>
            </select>
          </div>

        </div>

        <!-- Password -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Contraseña
          </label>

          <input
            type="password"
            placeholder="********"
            class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                   focus:outline-none focus:ring-2 focus:ring-blue-600"
          />
        </div>

        <!-- Botones -->
        <div class="flex gap-4 pt-4">

          <button
            type="reset"
            class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800
                   py-4 rounded-2xl font-bold transition"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white
                   py-4 rounded-2xl font-bold transition shadow-lg"
          >
            Guardar Usuario
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
