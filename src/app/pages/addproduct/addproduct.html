<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">

    <!-- Lado izquierdo -->
    <div class="bg-gray-900 text-white p-10 flex flex-col justify-center">

      <h2 class="text-4xl font-bold mb-4">
        Nuevo Producto
      </h2>

      <p class="text-gray-300 mb-8">
        Agrega productos fácilmente a tu inventario y administra tu catálogo de manera rápida.
      </p>

      <!-- Vista previa -->
      <div class="bg-gray-800 rounded-2xl p-6 flex flex-col items-center">

        <div class="w-40 h-40 bg-gray-700 rounded-2xl flex items-center justify-center overflow-hidden mb-4">
          <span class="text-gray-400 text-sm">
            Vista previa
          </span>
        </div>

        <p class="text-gray-400 text-sm text-center">
          La imagen del producto aparecerá aquí
        </p>

      </div>

    </div>

    <!-- Formulario -->
    <div class="p-10">

      <h3 class="text-2xl font-bold text-gray-800 mb-8">
        Información del Producto
      </h3>

      <form class="space-y-6">

        <!-- Imagen -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Imagen del producto
          </label>

          <input
            type="file"
            class="w-full border-2 border-dashed border-gray-300 rounded-2xl p-4
                   file:bg-gray-900 file:text-white file:border-0
                   file:px-4 file:py-2 file:rounded-xl
                   hover:border-gray-500 transition"
          />
        </div>

        <!-- Nombre -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Nombre del producto
          </label>

          <input
            type="text"
            placeholder="Ej. Laptop Gamer"
            class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                   focus:outline-none focus:ring-2 focus:ring-gray-900"
          />
        </div>

        <!-- Categoría -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">
            Categoría
          </label>

          <select
            class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                   focus:outline-none focus:ring-2 focus:ring-gray-900"
          >
            <option>Selecciona una categoría</option>
            <option>Tecnología</option>
            <option>Ropa</option>
            <option>Hogar</option>
            <option>Accesorios</option>
          </select>
        </div>

        <!-- Precio y stock -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div>
            <label class="block text-gray-700 font-semibold mb-2">
              Precio
            </label>

            <div class="relative">

              <span class="absolute left-4 top-4 text-gray-500">
                $
              </span>

              <input
                type="number"
                placeholder="0.00"
                class="w-full bg-gray-50 border border-gray-300 rounded-2xl
                       pl-8 pr-4 py-4
                       focus:outline-none focus:ring-2 focus:ring-gray-900"
              />

            </div>
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">
              Stock
            </label>

            <input
              type="number"
              placeholder="0"
              class="w-full bg-gray-50 border border-gray-300 rounded-2xl px-5 py-4
                     focus:outline-none focus:ring-2 focus:ring-gray-900"
            />
          </div>

        </div>

        <!-- Botones -->
        <div class="flex gap-4 pt-4">

          <button
            type="reset"
            class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800
                   py-4 rounded-2xl font-bold transition"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="w-1/2 bg-gray-900 hover:bg-black text-white
                   py-4 rounded-2xl font-bold transition shadow-lg"
          >
            Guardar Producto
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
