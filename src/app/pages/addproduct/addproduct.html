<div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-8 mt-10">

  <h2 class="text-3xl font-bold text-gray-800 mb-8">
    Agregar Producto
  </h2>

  <form class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class="md:col-span-2">
      <label class="block text-gray-700 font-semibold mb-2">
        Imagen del producto
      </label>

      <input
        type="file"
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               file:bg-gray-800 file:text-white file:border-0
               file:px-4 file:py-2 file:rounded-lg
               hover:file:bg-gray-700 transition"
      />
    </div>

    <div>
      <label class="block text-gray-700 font-semibold mb-2">
        Producto
      </label>

      <input
        type="text"
        placeholder="Nombre del producto"
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-gray-800"
      />
    </div>


    <div>
      <label class="block text-gray-700 font-semibold mb-2">
        Categoría
      </label>

      <select
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-gray-800"
      >
        <option>Selecciona una categoría</option>
        <option>Electrónica</option>
        <option>Ropa</option>
        <option>Hogar</option>
        <option>Accesorios</option>
      </select>
    </div>


    <div>
      <label class="block text-gray-700 font-semibold mb-2">
        Precio
      </label>

      <input
        type="number"
        placeholder="$0.00"
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-gray-800"
      />
    </div>


    <div>
      <label class="block text-gray-700 font-semibold mb-2">
        Stock
      </label>

      <input
        type="number"
        placeholder="Cantidad disponible"
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-gray-800"
      />
    </div>

    <div class="md:col-span-2 flex justify-end gap-4 mt-4">

      <button
        type="reset"
        class="bg-gray-300 hover:bg-gray-400 text-gray-800
               px-6 py-3 rounded-xl font-semibold transition"
      >
        Cancelar
      </button>

      <button
        type="submit"
        class="bg-gray-800 hover:bg-gray-700 text-white
               px-6 py-3 rounded-xl font-semibold transition"
      >
        Guardar Producto
      </button>

    </div>

  </form>
</div>
